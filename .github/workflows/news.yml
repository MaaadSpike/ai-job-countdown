# 每天抓一次各领域的 AI 新闻，更新 web/news.json 并提交。
# 可选配置（仓库 Settings → Secrets and variables → Actions）：
#   Secrets  NEWS_LLM_API_KEY                 设了就用 LLM 筛选、分类、翻译成中文；不设就用关键词规则，只有英文标题
#   Variables NEWS_LLM_BASE_URL / NEWS_LLM_MODEL  OpenAI 兼容接口地址和模型名（默认 OpenAI 的 gpt-4o-mini）
#   Variables NEWS_AUTO_DEPLOY = true          有新闻时顺便部署到 Cloudflare Pages（网站公开后再打开；
#                                              用 GITHUB_TOKEN 提交的 commit 不会触发其他 workflow，所以要在这里部署）
name: Update news

on:
  schedule:
    - cron: "17 14 * * *"   # 每天 UTC 14:17（温哥华早上 6/7 点）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect news
        env:
          NEWS_LLM_API_KEY: ${{ secrets.NEWS_LLM_API_KEY }}
          NEWS_LLM_BASE_URL: ${{ vars.NEWS_LLM_BASE_URL }}
          NEWS_LLM_MODEL: ${{ vars.NEWS_LLM_MODEL }}
        run: python news/collect.py -v
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- web/news.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "news.json 没变"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/news.json
          git commit -m "news: update $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: steps.commit.outputs.changed == 'true' && vars.NEWS_AUTO_DEPLOY == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name=ai-job-countdown --branch=main
